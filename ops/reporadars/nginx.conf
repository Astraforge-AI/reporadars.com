# This file is an exact-domain additive vhost. No shared nginx defaults change.
log_format reporadars_safe '$time_iso8601 $request_method $uri $status '
                          '$request_time $upstream_response_time';

server {
    listen 80;
    listen [::]:80;
    server_name reporadars.com www.reporadars.com;
    access_log /var/log/nginx/reporadars.access.log reporadars_safe;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 308 https://reporadars.com$request_uri; }
}

server {
    listen 151.80.21.140:443 ssl;
    listen [2001:41d0:c:c8c::]:443 ssl;
    server_name www.reporadars.com;
    ssl_certificate /etc/letsencrypt/live/reporadars.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reporadars.com/privkey.pem;
    access_log /var/log/nginx/reporadars.access.log reporadars_safe;
    # Redirect only safe page reads; never forward cookies or POST bodies to a new origin.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    return 308 https://reporadars.com$request_uri;
}

server {
    listen 151.80.21.140:443 ssl;
    listen [2001:41d0:c:c8c::]:443 ssl;
    server_name reporadars.com;
    ssl_certificate /etc/letsencrypt/live/reporadars.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reporadars.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/reporadars.access.log reporadars_safe;
    error_log /var/log/nginx/reporadars.error.log warn;
    client_max_body_size 64k;
    client_body_timeout 10s;
    keepalive_timeout 15s;

    # Current Cloudflare published ranges, verified 2026-09-07. Server-level
    # directives replace the host's broader inherited real-IP trust list.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location ~* ^/api(?:/|$) {
        # Removing this include is not a rollback: stop the API service as well.
        proxy_pass http://127.0.0.1:4320;
        proxy_http_version 1.1;
        proxy_set_header Host reporadars.com;
        proxy_set_header X-Reporadars-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
        proxy_send_timeout 10s;
        proxy_request_buffering on;
        proxy_cache off;
        proxy_intercept_errors on;
        error_page 413 = @api_too_large;
        error_page 500 502 503 504 = @api_unavailable;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location @api_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE"}}';
    }
    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":{"code":"UNAVAILABLE"}}';
    }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    # Public static-only artifact used by the authorized Cloudflare uploader.
    # A reviewed upload uses its SHA256, and this exact location is removed afterward.
    include /etc/reporadars-release-location.conf;
    # Pages/assets are served at Cloudflare, never recursively through Node.
    location / { return 404; }
}
